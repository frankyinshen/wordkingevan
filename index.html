<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>单词王 F&amp;G 决赛备考</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f8f5;--fg:#17322a;--card:#fff;--mut:#5d7a70;--ln:#cfe3da;--a:#1f9d55;--b:#2b7bb9;--bad:#d64545;--ok:#1f9d55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a16;--fg:#e6f2ec;--card:#182722;--mut:#93b0a5;--ln:#2b4239;--bad:#ff7a7a;--ok:#4cd08a}}
:root[data-theme="dark"]{--bg:#101a16;--fg:#e6f2ec;--card:#182722;--mut:#93b0a5;--ln:#2b4239;--bad:#ff7a7a;--ok:#4cd08a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:18px;margin:14px 0 8px}
.sub{color:var(--mut);font-size:13px;margin:0 0 10px}
nav{display:flex;gap:6px;margin:10px 0}
nav button{flex:1;padding:9px 4px;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:10px;font-size:15px}
nav button.on{background:var(--a);color:#fff;border-color:var(--a)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.tr{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:14px;margin:8px 0;color:#fff;font-size:16px}
.tr b{font-size:19px;display:block}.tr span{font-size:13px;opacity:.92}
.A{background:var(--a)}.B{background:var(--b)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:20px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
.top b{color:var(--fg)}
.tm{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}
#bar{height:100%;width:100%;background:var(--a)}
.q{text-align:center;padding:10px 0}
.hint{font-size:20px;font-weight:600;margin:4px 0 8px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{padding:16px;font-size:22px;border:2px solid var(--ln);background:var(--card);color:var(--fg);border-radius:14px}
.opt.good{border-color:var(--ok);background:rgba(31,157,85,.18)}.opt.bad{border-color:var(--bad);background:rgba(214,69,69,.15)}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.ch{min-width:38px;height:48px;line-height:44px;font-size:26px;font-weight:700;text-align:center;border-bottom:3px solid var(--fg);font-family:Menlo,Consolas,monospace}
input.ch{width:42px;border:0;border-bottom:3px solid var(--a);background:rgba(31,157,85,.12);color:var(--fg);border-radius:6px 6px 0 0;padding:0;text-transform:lowercase}
input.wd{width:100%;max-width:340px;font-size:26px;text-align:center;padding:10px;border:2px solid var(--a);border-radius:12px;background:var(--card);color:var(--fg)}
.tile{min-width:46px;height:52px;font-size:26px;font-weight:700;border:2px solid var(--b);background:var(--card);color:var(--fg);border-radius:10px;font-family:Menlo,Consolas,monospace}
.tile:disabled{opacity:.25}
.go{padding:12px 22px;font-size:17px;border:0;border-radius:12px;background:var(--a);color:#fff;margin:6px 4px}
.go.g{background:var(--card);color:var(--fg);border:1px solid var(--ln)}
.fb{min-height:24px;text-align:center;font-size:17px;margin-top:8px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.tip b{color:var(--a)}
.tip p,.irr p{margin:4px 0}
.w{display:inline-block;margin:3px 4px 3px 0;padding:5px 9px;border:1px solid var(--ln);border-radius:10px;font-size:14px;background:var(--card);color:var(--fg)}
.w b{font-size:16px}.w i{color:var(--mut);font-style:normal;font-size:12px}
.hide{display:none}
.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
.big{font-size:40px;font-weight:700;margin:10px 0;letter-spacing:1px}.df{font-size:17px;margin:6px 0 10px;color:var(--mut)}
.tile2{min-width:40px;height:48px;line-height:48px;font-size:28px;font-weight:700;text-align:center;border:2px solid var(--b);border-radius:10px;font-family:Menlo,Consolas,monospace}
.ch.fill{color:var(--ok)}.jb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.j{padding:18px 4px;font-size:16px;border:0;border-radius:12px;color:#fff}.j.ok{background:var(--a)}.j.no{background:var(--bad)}.j.ot{background:#c77d00}
select{font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--fg);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.two label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px;justify-content:flex-end}
textarea{width:100%;font-size:13px;border:1px solid var(--ln);border-radius:10px;padding:8px;background:var(--card);color:var(--fg);margin:6px 0}
.pb{height:8px;background:var(--ln);border-radius:5px;overflow:hidden;margin:3px 0 8px}.pb i{display:block;height:100%;background:var(--a);width:0}
.sm{font-size:13px;color:var(--mut)}
.chip:disabled{opacity:.4}
.pl{font-size:20px;padding:14px 26px}
.conf-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;margin-bottom:10px}
.conf-table th,.conf-table td{border:1px solid var(--ln);padding:6px;text-align:left;vertical-align:top}
.conf-table th{background:rgba(31,157,85,.1);font-size:12px;color:var(--mut)}
.conf-table td:nth-child(2){white-space:nowrap}
.link-btn{background:none;border:0;color:var(--a);font-weight:bold;padding:0;font-size:14px;cursor:pointer;text-align:left}
.progress-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progress-item{background:var(--card);padding:10px;border-radius:10px;border:1px solid var(--ln)}
.detail-box{display:block;width:100%;background:var(--bg);padding:8px 10px;border-radius:8px;margin:4px 0 8px;font-size:13px;color:var(--mut);border-left:3px solid var(--a)}
</style>
</head>
<body>
<main>
<h1>👑 单词王 · F&amp;G 组决赛备考</h1>
<p class="sub">题库来自 Excel「单词练习表 Unit1-23」，共 470 个单词</p>
<nav><button class="on" data-v="home">练习</button><button data-v="tips">答题技巧</button><button data-v="irr">不规则词表</button><button data-v="conf">易混词辨析</button></nav>

<section id="home">
<div class="card" style="margin-top:0"><b>📈 学习进度</b>
<div class="progress-grid" id="progGrid" style="margin-top:10px"></div>
<div class="sm">每次优先出没学过的单词，全部学完一遍后再随机复习。做错的题自动进入错题本。</div>
<button class="chip" id="rst" style="margin-top:8px">重置进度和错题本</button></div>
<div class="card"><b>⚙ 设置</b>
<div class="two"><label>火眼金睛 / 明辨词性<span>每关题量</span><select id="n1"></select></label><label>字母补全 / 词序达人 / 听音拼词 / 听释义拼词<span>题量</span><select id="n2"></select></label></div>
<div class="chips"><select id="vs" style="flex:1 1 150px;width:auto"></select><button class="chip" id="au"></button><button class="chip" id="tst">🔊 测试发音</button></div><div class="sm" id="tsm" style="margin-top:6px"></div></div>
<button class="tr A" data-s="ab"><b>火眼金睛 + 明辨词性</b><span>孩子自己点选项，系统自动判断：先火眼金睛，再明辨词性，每题 10 秒；题量在上面设置</span></button>
<button class="tr A" data-s="r3a"><b>字母补全（A 赛区第三关）</b><span>大人判断：孩子口头说或写在纸上，时间到显示答案，大人点 对 / 错 / 会但超时</span></button>
<button class="tr B" data-s="r3b"><b>词序达人（B 赛区第三关）</b><span>大人判断：无任何提示，时间到显示答案，大人点 对 / 错 / 会但超时</span></button>
<div class="card"><b>🎧 听音拼词（大人判断）</b>
<p class="sm">屏幕直接显示答案给大人看，孩子只听、口头拼或写在纸上。时间到后大人判断对错。</p>
<div class="chips"><button class="chip" data-s="d1">听音拼词 · 5秒/词</button><button class="chip" data-s="d2">听释义拼词 · 15秒/词</button></div></div>
<div class="card"><b>🎯 错题重点复习</b><p class="sm">每次最多复习设定题量，优先错得多的词；连续答对3次自动移出错题本。</p>
<div class="chips" id="rf" style="margin-bottom:8px"></div><div class="chips" id="rv"></div></div>
<div class="card"><b>💾 错题本 · 导出 / 导入</b>
<p class="sm">导出一段文字码（含错题和学习进度），在另一台设备粘贴导入。导入是合并，不会覆盖已有记录。</p>
<textarea id="code" rows="3" placeholder="导出的码显示在这里；导入时把码粘贴到这里"></textarea>
<div class="chips"><button class="chip" id="ex">导出并复制</button><button class="chip" id="dl" hidden>下载文件</button><button class="chip" id="im">导入</button><button class="chip" id="fl">从文件导入</button><button class="chip" id="vw">查看错题本</button></div>
<input type="file" id="fi" accept=".txt,text/plain" hidden>
<div class="sm" id="ms" style="margin-top:6px"></div><div id="wl" style="margin-top:6px"></div></div>
</section>

<section id="run" class="hide">
<div class="card">
<div class="top"><span id="tag"></span><span>得分 <b id="sc">0</b></span></div>
<div class="top"><span id="prog"></span><span>剩余 <b id="sec">-</b> 秒</span></div>
<div class="tm"><div id="bar"></div></div>
<div class="q"><div id="prompt"></div><div id="body"></div><div class="fb" id="fb"></div><div id="ctl"></div><div id="nx"></div><div id="und" style="margin-top:14px"></div></div>
</div>
<div style="text-align:center;margin-top:72px"><button class="go g" id="quit">退出到首页</button></div>
</section>

<section id="tips" class="hide"></section>
<section id="irr" class="hide"></section>
<section id="conf" class="hide"></section>
</main>

function draw(k,used,f,min=1){
  const sn=S.seen[k];

function pickVoice(){
  let vs=[];try{vs=speechSynthesis.getVoices().filter(v=>v.lang&&/^en/i.test(v.lang))}catch(e){}
  const us=vs.filter(v=>/^en[-_]US$/i.test(v.lang)),by=re=>us.find(v=>re.test(v.name));
  VOICE=by(/Samantha/i)||by(/Google US English/i)||by(/Microsoft.*(Aria|Jenny|Zira)/i)||by(/Microsoft.*(David|Mark|Guy)/i)
      ||us.find(v=>v.localService)||us[0]||vs[0]||null;
}
function loadVoices(){
  pickVoice();

  const g1=document.createElement('optgroup');g1.label='系统音色';
  g1.appendChild(new Option(DEVICE==='iPhone'||!VOICE?'系统默认音色':`${VOICE.name} (${VOICE.lang})`,'sys:'));
  const g2=document.createElement('optgroup');g2.label='在线音色（需联网）';

function stopAudio(){if(CA){CA.oncanplaythrough=CA.onplaying=CA.onended=CA.onerror=null;try{CA.pause()}catch(e){}CA=null}}

function speak(t,h={}){
  stopAudio();
  const mode = PF.tts || 'on:yd';
  return mode.startsWith('on:') ? speakOnline(t,h) : speakSystem(t,h);
}

function speakSystem(t,h={}){
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){h.fail&&h.fail();return false}
  let began=false,done=false;
  const end=()=>{if(!done){done=true;h.end&&h.end()}},fail=()=>{if(!done){done=true;h.fail&&h.fail()}};
  try{
    const u=new SpeechSynthesisUtterance(String(t));
    u.lang='en-US';u.rate=.92;u.volume=1;u.pitch=1;
    if(DEVICE!=='iPhone'){if(!VOICE)pickVoice();if(VOICE)u.voice=VOICE}
    u.onstart=()=>{began=true;h.begin&&h.begin()};
    u.onend=end;
    u.onerror=ev=>{if(ev&&(ev.error==='interrupted'||ev.error==='canceled')){done=true;return}began?end():fail()};
    window.__utt=u;
    const go=()=>{try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){fail()}};
    if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();if(DEVICE==='other')setTimeout(go,80);else go()}else go();
  }catch(e){fail();return false}
  setTimeout(()=>{const p=setInterval(()=>{if(done){clearInterval(p);return}
    if(!speechSynthesis.speaking&&!speechSynthesis.pending){clearInterval(p);began?end():fail()}},400)},1500);
  return true;
}

function speakOnline(t,h={}){
  try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  if(onFail>=2){return speakSystem(t,h)}
  ttsNote('⏳ 有道在线加载中…');
  const a=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(t)+'&type=2');
  CA=a;a.playbackRate=.9;let began=false,done=false;
  const back=why=>{if(done)return;done=true;onFail++;stopAudio();
    ttsNote(why+(onFail>=2?'；后面都直接用系统音色':'，已改用系统音色'));speakSystem(t,h)};
  a.oncanplaythrough=()=>{
    if(done)return;
    a.play().then(()=>{began=true;onFail=0;h.begin&&h.begin();ttsNote('🔊 有道 · 英语女声')})
           .catch(()=>{if(!began&&!done)back('⚠️ 浏览器拦截自动播放')});
  };
  a.onended=()=>{if(!done){done=true;h.end&&h.end()}};
  a.onerror=()=>{if(!began)back('❌ 有道在线失败');else if(!done){done=true;h.end&&h.end()}};
  setTimeout(()=>{if(!began&&!done&&CA===a&&a.readyState<3)back('⏱ 在线加载超时')},3000);
  return true;
}

function cands(w){
  const L=w.length,m=new Set(),s=new Set();
  for(let i=1;i<L-1;i++)if(w[i]!==w[i+1])m.add(w.slice(0,i)+w[i+1]+w[i]+w.slice(i+2));
  for(let i=1;i<L;i++)w[i]===w[i-1]?m.add(w.slice(0,i)+w.slice(i+1)):m.add(w.slice(0,i)+w[i]+w.slice(i));
  [['ea','ee'],['ee','ea'],['ie','ei'],['ei','ie'],['ou','ow'],['ow','ou'],['ai','ay'],['oo','ou'],['ph','f'],['ck','k'],['ss','s'],['ght','t'],['tion','sion'],['le','el'],['er','or'],['or','er'],['ar','er'],['c','s'],['s','c'],['y','i'],['i','y']].forEach(([a,b])=>{const i=w.indexOf(a);if(i>0)m.add(w.slice(0,i)+b+w.slice(i+a.length))});
  for(let i=1;i<L;i++)if(V.includes(w[i]))for(const v of V)if(v!==w[i])s.add(w.slice(0,i)+v+w.slice(i+1));
  return[m,s];
}
function miss(w){
  const L=w.length,[m,s]=cands(w);
  const ok=z=>z!==w&&!SET.has(z.toLowerCase())&&!BAN.has(z.toLowerCase());
  const f=x=>shuf([...x].filter(ok));
  const a=f(m),b=f(s),r=[];
  if(a[0])r.push(a[0]);
  for(const z of [...b,...a.slice(1)]){if(r.length>=2)break;if(!r.includes(z))r.push(z)}
  for(let k=0;r.length<2&&k<50;k++){const i=1+rnd(L-1),z=w.slice(0,i)+w[i]+w.slice(i);if(ok(z)&&!r.includes(z))r.push(z)}
  return r;
}

let st=null,timer=null;
function show(v){['home','run','tips','irr','conf'].forEach(k=>$('#'+k).classList.toggle('hide',k!==v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(v==='run'?'home':v)));if(v==='home')home()}
function stop(){clearInterval(timer);silence()}
function begin(seq,tag,rv){
  stop();
  st={seq,tag,ri:0,qi:0,sc:seq.map(()=>0),tot:0,wrong:[],tg:{},used:new Set(),rv:!!rv,hist:[]};
  // 预生成固定顺序的词列表，确保撤销重答不改变下一题，且能按顺序过一遍
  st.seq = st.seq.map(s => {
    if (s.words) return s; // 错题复习模式已有词列表
    const ws = draw(s.k, new Set()); // 正常练习：洗牌一次生成固定列表，优先没学过的
    return { k: s.k, words: ws.map(w => w.w) };
  });
  show('run');next()
}
function next(){
  stop();const s=st.seq[st.ri],n=cnt(s);
  if(st.qi>=n)return summary(s,R[s.k],n);
  mount(MK[s.k](st.used,s.words&&BY[s.words[st.qi]]),false);
}
function mount(q,redo){
  const s=st.seq[st.ri],r=R[s.k],n=cnt(s);
  st.q=q;st.locked=false;st.started=false;st.paused=false;st.r=r;st.rem=r.t*1000;
  $('#tag').textContent=`${st.tag} · ${r.name}`;$('#prog').textContent=`第 ${st.qi+1} / ${n} 题`;$('#sc').textContent=st.tot;
  $('#prompt').innerHTML=q.prompt;$('#fb').textContent='';$('#fb').className='fb';$('#nx').innerHTML='';$('#ctl').innerHTML='';$('#und').innerHTML='';
  $('#bar').style.width='100%';$('#sec').textContent=r.t;
  q.body($('#body'),{locked:()=>st.locked,fin,start:()=>start(q),auto:PF.auto&&!redo});
  if(q.adult){
    $('#ctl').innerHTML='<button class="go g" id="pz">⏸ 暂停</button>'+(q.listen?'':`<button class="go g" id="en">${q.endLabel}</button>`);
    $('#pz').onclick=pause;if(!q.listen)$('#en').onclick=()=>reveal(q);undoBtn();
    if(q.listen)jbtns();else if(redo)reveal(q);else start(q);
  }else start(q);
}
function run(me){
  st.t0=Date.now();clearInterval(timer);
  timer=setInterval(()=>{const left=st.rem-(Date.now()-st.t0);
    $('#bar').style.width=Math.max(left/(st.r.t*1000),0)*100+'%';$('#sec').textContent=Math.max(0,Math.ceil(left/1000));
    if(left<=0&&st.q===me){clearInterval(timer);st.rem=0;me.adult?(me.listen?timeup():reveal(me,true)):fin(me.get?me.get():false)}},100);
}
function start(me){
  if(!st||st.q!==me||st.started||st.locked)return;st.started=true;const o=$('#ot');if(o)o.style.display='none';run(me);
}
function pause(){
  if(!st.started||st.locked||st.rem<=0)return;
  if(st.paused){st.paused=false;$('#pz').textContent='⏸ 暂停';run(st.q)}
  else{st.paused=true;clearInterval(timer);st.rem-=Date.now()-st.t0;$('#pz').textContent='▶ 继续'}
}
function record(res){
  const q=st.q,s=st.seq[st.ri],key=s.k+'|'+q.wd.w;
  q.shown.forEach(w=>S.seen[s.k].add(w.w));
  if(res==='ok'){
    st.sc[st.ri]++;st.tot++;
    if(st.rv){ // 复习模式
      const e=S.wrong[key];
      if(e){
        e.s=(e.s||0)+1; e.c=0; // 连续答对+1，连续答错清零
        if(e.s>=3) delete S.wrong[key]; // 掌握并移除
      }
    }
  } else {
    st.wrong.push(q.wd);st.tg[q.wd.w]=res;
    const e=S.wrong[key]||{w:q.wd.w,k:s.k,n:0,s:0,c:0};e.n++;e.t=res;e.s=0; // 连续答对清零
    if(res==='x') e.c=(e.c||0)+1; else e.c=0;
    S.wrong[key]=e;
  }
  save();
}
function fin(ok){
  if(st.locked)return;st.locked=true;clearInterval(timer);silence()
  const q=st.q;record(ok?'ok':'x');
  $('#sc').textContent=st.tot;const f=$('#fb');
  f.className='fb '+(ok?'ok':'no');f.textContent=ok?'✅ '+q.reveal:'❌ 正确答案：'+q.reveal;
  st.qi++;
  if(ok)setTimeout(()=>{if(st&&st.q===q)next()},1400);
  else{$('#nx').innerHTML='<button class="go">继续</button>';$('#nx').firstChild.onclick=next}
}
function reveal(q,timeup){

function judge(res){
  if(Date.now()-st.jt<450)return;
  const q=st.q,s=st.seq[st.ri],key=s.k+'|'+q.wd.w;
  st.hist.push({ri:st.ri,qi:st.qi,q,key,prev:S.wrong[key]?{...S.wrong[key]}:null,sc:st.sc[st.ri],tot:st.tot,wl:st.wrong.length});
  record(res);st.qi++;next();

function undoBtn(){
  const el=$('#und');

  if(st.q && st.q.adult){

    $('#star').onclick=()=>{
      const k=st.seq[st.ri].k, w=st.q.wd.w, key=k+'|'+w;

        save();

function undo(){

  st.sc[h.ri]=h.sc;st.tot=h.tot;st.wrong.length=h.wl;st.ri=h.ri;st.qi=h.qi;save();mount(h.q,true);

function exp(){
  const o={v:2,n:W.length,w:Object.values(S.wrong).map(e=>[e.w,e.k,e.n,e.t||'x',e.s||0,e.c||0]),
    r1:bits(S.seen.r1,'r1'),r2:bits(S.seen.r2,'r2'),r3a:bits(S.seen.r3a,'r3a'),r3b:bits(S.seen.r3b,'r3b'),d1:bits(S.seen.d1,'d1'),d2:bits(S.seen.d2,'d2')};
  return 'KOW2:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function imp(code){
  code=code.replace(/\s+/g,'');if(!code.startsWith('KOW2:'))throw 0;
  const o=JSON.parse(decodeURIComponent(escape(atob(code.slice(5)))));let c=0;
  o.w.forEach(([w,k,n,t,s,cc])=>{if(!BY[w]||!MODE[k])return;const key=k+'|'+w,e=S.wrong[key];c++;
    if(!e)S.wrong[key]={w,k,n,t,s:s||0,c:cc||0};else{e.n=Math.max(e.n,n);e.t=e.t||t;e.s=e.s||s||0;e.c=e.c||cc||0}});
  if(o.n===W.length){
    [['r1','r1'],['r2','r2'],['r3a','r3a'],['r3b','r3b'],['d1','d1'],['d2','d2']].forEach(([a,b])=>[...o[a]].forEach((ch,i)=>ch==='1'&&S.seen[b].add(W[i].w)));
  }
  save();return c;
}

function home(){
  const types=[['r1','火眼金睛'],['r2','明辨词性'],['r3a','字母补全'],['r3b','词序达人'],['d1','听音拼词'],['d2','听释义拼词']];
  $('#progGrid').innerHTML = types.map(([k,name])=>`
    <div class="progress-item">
      <div class="sm">${name} <b id="p_${k}"></b></div>
      <div class="pb"><i id="b_${k}"></i></div>
    </div>
  `).join('');
  types.forEach(([k])=>{
    $(`#p_${k}`).textContent=`${S.seen[k].size} / ${TOT[k]}`;
    $(`#b_${k}`).style.width=100*S.seen[k].size/TOT[k]+'%';
  });

  $('#n1').innerHTML=NS.map(n=>`<option value="${n}" ${PF.n1===n?'selected':''}>${n} 题</option>`).join('');
  $('#n2').innerHTML=NS.map(n=>`<option value="${n}" ${PF.n===n?'selected':''}>${n} 题</option>`).join('');
  $('#au').textContent='🔊 自动播放：'+(PF.auto?'开':'关');$('#au').classList.toggle('on',PF.auto);
  $('#rf').innerHTML=[['all','全部'],['o','⏱ 仅会但超时'],['x','❌ 仅答错']].map(([k,l])=>`<button class="chip ${PF.rf===k?'on':''}" data-f="${k}">${l}</button>`).join('');
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{PF.rf=b.dataset.f;save();home()});
  $('#rv').innerHTML=Object.keys(G).map(g=>{const n=Object.values(S.wrong).filter(e=>G[g].ks.includes(e.k)&&WF(e)).length;
    return`<button class="chip" data-g="${g}" ${n?'':'disabled'}>${G[g].n}（${n}）</button>`}).join('');
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>review(b.dataset.g));
}
function review(g){
  const es=Object.values(S.wrong).filter(e=>G[g].ks.includes(e.k)&&WF(e));if(!es.length)return;
  es.sort((a,b)=>b.n-a.n);
  const seq=G[g].ks.map(k=>{
    const ws=es.filter(e=>e.k===k).map(e=>e.w);
    return ws.length?{k,words:ws}:null;
  }).filter(Boolean);
  begin(seq,'错题复习',true);
}
const SEQ={ab:[{k:'r1'},{k:'r2'}],r3a:[{k:'r3a'}],r3b:[{k:'r3b'}],d1:[{k:'d1'}],d2:[{k:'d2'}]};
const TAG={ab:'综合练习',r3a:'A 赛区',r3b:'B 赛区',d1:'听音',d2:'听音'};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>begin(SEQ[b.dataset.s],TAG[b.dataset.s]));
 $('#au').onclick=()=>{PF.auto=!PF.auto;save();home()};
 $('#n1').onchange=()=>{PF.n1=+$('#n1').value;save()};$('#n2').onchange=()=>{PF.n=+$('#n2').value;save()};
 $('#tst').onclick=()=>{const o=$('#vs').selectedOptions[0];$('#tsm').textContent=`正在朗读（${o?o.textContent:''}）……听不到的话，检查静音键和音量。`;
  onFail=0;speak('Hello. This is a sound test.',{fail:()=>$('#tsm').textContent='这个环境不支持朗读，请大人念单词，练习时点「仅计时」。'})};
 $('#vs').onchange=()=>{PF.tts=$('#vs').value;onFail=0;save()};
let rc=0;$('#rst').onclick=()=>{if(!rc){rc=1;$('#rst').textContent='再点一次确认清空';setTimeout(()=>{rc=0;$('#rst').textContent='重置进度和错题本'},3000)}else{Object.keys(S.seen).forEach(k=>S.seen[k].clear());S.wrong={};save();rc=0;$('#rst').textContent='重置进度和错题本';home()}};
let DL=null;
try{window.claude&&claude.use&&claude.use('downloads').then(d=>{if(d){DL=d;$('#dl').hidden=false}}).catch(()=>{})}catch(e){}
 $('#ex').onclick=async()=>{const c=exp();const ta=$('#code');ta.value=c;ta.select();let ok=false;
  try{await navigator.clipboard.writeText(c);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(e2){}}
  $('#ms').textContent=ok?'已复制，可以粘贴到微信或备忘录。':'请长按文本框，全选后复制。'};
 $('#im').onclick=()=>{try{const n=imp($('#code').value);$('#ms').textContent=`导入完成：合并了 ${n} 条错题。`;home()}catch(e){$('#ms').textContent='导入失败：码不完整或格式不对，请重新复制完整内容。'}};
 $('#dl').onclick=async()=>{try{await DL.save({filename:'单词王错题本.txt',data:exp()});$('#ms').textContent='已保存。'}catch(e){$('#ms').textContent=e&&e.code==='declined'?'已取消。':'保存失败，请改用复制。'}};
 $('#fl').onclick=()=>$('#fi').click();
 $('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#code').value=r.result;$('#im').click()};r.readAsText(f);e.target.value=''};
 $('#vw').onclick=()=>{
  const el=$('#wl');if(el.innerHTML){el.innerHTML='';return}
  const types=[['r1','火眼金睛'],['r2','明辨词性'],['r3a','字母补全'],['r3b','词序达人'],['d1','听音拼词'],['d2','听释义拼词']];
  let html='';
  types.forEach(([k,name])=>{
    const es=Object.values(S.wrong).filter(e=>e.k===k).sort((a,b)=>b.n-a.n);
    if(es.length){
      html+=`<div class="card" style="text-align:left"><b>${name}（${es.length}）</b><p class="sub">点击单词可听发音。${k==='d2'?'点击后展开释义。':''}</p><div>`;
      es.forEach(e=>{
        const x=BY[e.w];
        const fire = e.n>3?'🔥':'';
        let tag = e.s>=3 ? '✅掌握' : (e.n>=3 || e.c>=2 ? '🥶生疏' : '😐熟悉');
        if(e.t==='star') tag='⭐重点';
        // 如果是听释义拼词(d2)，点击时朗读释义(x.d)，否则朗读单词(e.w)
        let speakText = (k==='d2' && x) ? x.d : e.w;
        speakText = speakText.replace(/'/g, "\\'"); // 转义文本中的单引号，防止JS报错
        let clickAction = `speak('${speakText}')`;
        if(k==='d2'){
          clickAction += `; var d=document.getElementById('det_${e.w}'); if(d){d.style.display=d.style.display==='block'?'none':'block';}`;
        }
        html+=`<button class="w" onclick="${clickAction}"><b>${e.w}</b> ${fire} <i>${x?x.c:''} · ${tag} · ❌×${e.n}</i></button>`;
        if(k==='d2' && x){
          html+=`<div id="det_${e.w}" class="detail-box" style="display:none;">📖 ${x.d}</div>`;
        }
      });
      html+=`</div></div>`;
    }
  });
  el.innerHTML = html || '<p class="sm">错题本是空的。</p>';
};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{stop();show(b.dataset.v)});
 $('#quit').onclick=()=>{stop();show('home')};
 $('#tips').innerHTML=TIPS.map(([t,x])=>`<div class="card tip"><b>${t}</b>${x.map(s=>`<p>${s}</p>`).join('')}</div>`).join('');
 $('#irr').innerHTML='<p class="sub">这些词的读音和字母对应关系不完全符合自然拼读规律，需要“整词记忆”。点单词可听发音。</p>'+IRR.map(([t,l])=>`<div class="card irr"><b>${t}</b><p>${l.map(([w,n])=>`<button class="w" onclick="speak('${w.replace("'","")}')"><b>${w}</b> <i>${n}</i></button>`).join('')}</p></div>`).join('');
 $('#conf').innerHTML='<p class="sub">这些词在拼写或中文意思上容易混淆，请注意对比它们的不同点。点击单词可听发音。英文释义严格匹配题库。</p>'+CONF.map(([t,l])=>`<div class="card conf"><b>${t}</b><table class="conf-table"><thead><tr><th>单词</th><th>词性</th><th>英文释义</th><th>中文翻译</th></tr></thead><tbody>${l.map(([w,p,cn])=>{const cleanW=w.split(' ')[0];const x=BY[cleanW];const en=x?x.d:'（题库未收录此词）';return `<tr><td><button class="link-btn" onclick="speak('${cleanW}')">${w}</button></td><td>${p}</td><td>${en}</td><td>${cn}</td></tr>`;}).join('')}</tbody></table></div>`).join('');
loadVoices();home();
</script>
